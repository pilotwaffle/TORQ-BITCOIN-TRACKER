# Bitcoin Core Configuration for TBWI
# Place this in your Bitcoin Core data directory or use -conf= flag

# Server mode
server=1

# Transaction index (required for getrawtransaction)
txindex=1

# RPC configuration
rpcuser=btcuser
rpcpassword=btcpass
rpcallowip=127.0.0.1
rpcallowip=172.16.0.0/12
rpcallowip=192.168.0.0/16
rpcbind=0.0.0.0

# ZMQ streaming endpoints
zmqpubrawtx=tcp://0.0.0.0:28332
zmqpubrawblock=tcp://0.0.0.0:28333

# Network selection (uncomment ONE of the following)
# For testnet (recommended for development):
testnet=1

# For mainnet (production):
# mainnet=1

# For regtest (local testing):
# regtest=1

# Performance tuning
dbcache=4096
maxmempool=300
maxconnections=125

# Logging
printtoconsole=1
debug=zmq
