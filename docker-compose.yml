# TBWI - Torq Bitcoin Whale Intelligence
# Docker Compose configuration for local development and deployment

version: "3.9"

services:
  # ============================================================================
  # Infrastructure Services
  # ============================================================================

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: tbwi-postgres
    environment:
      POSTGRES_DB: tbwi
      POSTGRES_USER: tbwi
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tbwi_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tbwi -d tbwi"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis for message queue
  redis:
    image: redis:7-alpine
    container_name: tbwi-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Bitcoin Core (mainnet, pruned ~10GB)
  # Set BITCOIN_NETWORK=mainnet in your .env file
  bitcoin-core:
    image: ruimarinho/bitcoin-core:24
    container_name: tbwi-bitcoin
    command:
      - -server=1
      - -prune=10000
      - -rpcuser=${BITCOIN_RPC_USER:-btcuser}
      - -rpcpassword=${BITCOIN_RPC_PASSWORD:-btcpass}
      - -rpcallowip=0.0.0.0/0
      - -rpcbind=0.0.0.0
      - -zmqpubrawtx=tcp://0.0.0.0:28332
      - -zmqpubrawblock=tcp://0.0.0.0:28333
      - -printtoconsole=1
    volumes:
      - bitcoin_data:/home/bitcoin/.bitcoin
    ports:
      - "8332:8332"    # RPC (mainnet)
      - "28332:28332"  # ZMQ rawtx
      - "28333:28333"  # ZMQ rawblock
    healthcheck:
      test: ["CMD", "bitcoin-cli", "-rpcuser=${BITCOIN_RPC_USER:-btcuser}", "-rpcpassword=${BITCOIN_RPC_PASSWORD:-btcpass}", "getblockchaininfo"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # ============================================================================
  # TBWI Application Services
  # ============================================================================

  # ZMQ Listener - Streams transactions from Bitcoin Core
  zmq-listener:
    build:
      context: .
      target: zmq-listener
    container_name: tbwi-zmq-listener
    depends_on:
      redis:
        condition: service_healthy
      bitcoin-core:
        condition: service_healthy
    environment:
      - BITCOIN_ZMQ_TX_ENDPOINT=tcp://bitcoin-core:28332
      - BITCOIN_ZMQ_BLOCK_ENDPOINT=tcp://bitcoin-core:28333
      - BITCOIN_NETWORK=${BITCOIN_NETWORK:-mainnet}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - THRESHOLD_MIN_TX_BTC=${MIN_TX_THRESHOLD_BTC:-10}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    restart: unless-stopped

  # Transaction Classifier
  classifier:
    build:
      context: .
      target: classifier
    container_name: tbwi-classifier
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - BITCOIN_RPC_HOST=bitcoin-core
      - BITCOIN_RPC_PORT=8332
      - BITCOIN_RPC_USER=${BITCOIN_RPC_USER:-btcuser}
      - BITCOIN_RPC_PASSWORD=${BITCOIN_RPC_PASSWORD:-btcpass}
      - BITCOIN_NETWORK=${BITCOIN_NETWORK:-mainnet}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=tbwi
      - DB_USER=tbwi
      - DB_PASSWORD=${DB_PASSWORD:-tbwi_secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - THRESHOLD_LARGE_TX_BTC=${LARGE_TX_THRESHOLD_BTC:-50}
      - PRICE_ENABLED=${PRICE_ENABLED:-true}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    restart: unless-stopped

  # Event Engine - Clusters transactions into whale events
  event-engine:
    build:
      context: .
      target: event-engine
    container_name: tbwi-event-engine
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - BITCOIN_NETWORK=${BITCOIN_NETWORK:-mainnet}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=tbwi
      - DB_USER=tbwi
      - DB_PASSWORD=${DB_PASSWORD:-tbwi_secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - THRESHOLD_SINGLE_DEPOSIT_BTC=${SINGLE_DEPOSIT_THRESHOLD_BTC:-1000}
      - THRESHOLD_DEPOSIT_BURST_MIN_COUNT=${DEPOSIT_BURST_MIN_COUNT:-10}
      - THRESHOLD_DEPOSIT_BURST_MIN_BTC=${DEPOSIT_BURST_MIN_BTC:-1000}
      - THRESHOLD_DEPOSIT_BURST_WINDOW_MINUTES=${DEPOSIT_BURST_WINDOW_MINUTES:-10}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    restart: unless-stopped

  # Webhook Dispatcher - Sends events to external webhooks
  webhook-dispatcher:
    build:
      context: .
      target: webhook-dispatcher
    container_name: tbwi-webhook-dispatcher
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=tbwi
      - DB_USER=tbwi
      - DB_PASSWORD=${DB_PASSWORD:-tbwi_secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - WEBHOOK_ENABLED=${WEBHOOK_ENABLED:-true}
      - WEBHOOK_URLS=${WEBHOOK_URLS:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    restart: unless-stopped

  # REST API Gateway
  api:
    build:
      context: .
      target: api
    container_name: tbwi-api
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8080:8000"
    environment:
      - BITCOIN_RPC_HOST=bitcoin-core
      - BITCOIN_RPC_PORT=8332
      - BITCOIN_RPC_USER=${BITCOIN_RPC_USER:-btcuser}
      - BITCOIN_RPC_PASSWORD=${BITCOIN_RPC_PASSWORD:-btcpass}
      - BITCOIN_NETWORK=${BITCOIN_NETWORK:-mainnet}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=tbwi
      - DB_USER=tbwi
      - DB_PASSWORD=${DB_PASSWORD:-tbwi_secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - API_API_KEY=${API_KEY:-}
      - API_CORS_ORIGINS=["*"]
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENVIRONMENT=${ENVIRONMENT:-development}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  bitcoin_data:

networks:
  default:
    name: tbwi-network
